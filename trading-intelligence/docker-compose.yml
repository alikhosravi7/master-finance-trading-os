services:
  db:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_DB: trading_intelligence
      POSTGRES_USER: ti_user
      POSTGRES_PASSWORD: change_me_local_only
    ports: ["5432:5432"]
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ti_user -d trading_intelligence"]
      interval: 5s
      timeout: 5s
      retries: 20
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    volumes: [redis_data:/data]
  api:
    build: ./apps/api
    environment:
      DATABASE_URL: postgresql+psycopg://ti_user:change_me_local_only@db:5432/trading_intelligence
      REDIS_URL: redis://redis:6379/0
      APP_ENV: development
      CORS_ORIGINS: http://localhost:3000
    ports: ["8000:8000"]
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_started}
    volumes: ["./apps/api:/app"]
  web:
    build: ./apps/web
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports: ["3000:3000"]
    depends_on: [api]
volumes:
  postgres_data:
  redis_data:
